<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Via · 你的AI阅读伙伴</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="daily-review.css">
</head>
<body>
  <div class="stage"><div class="app" aria-label="Via 桌面主界面">
    <header class="windowbar">
      <div class="caption"><span class="tiny-logo">v</span> Vibe with Via <span>· 你的终端Vibe搭子</span></div>
      <div class="window-controls">
        <button id="minimizeWindow" title="最小化" aria-label="最小化">−</button>
        <button id="maximizeWindow" title="最大化" aria-label="最大化">□</button>
        <button id="closeWindow" title="关闭" aria-label="关闭">×</button>
      </div>
    </header>
    <div class="app-body">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark" id="brandAvatar">我</span><div><strong id="brandName">本机用户</strong><small id="brandSignature">阅读，留下思考</small></div></div>
        <button class="nav-button active" data-page="home" title="首页"><svg viewBox="0 0 20 20"><path d="M3 9.2 10 3l7 6.2V17H3zM7.5 17v-5h5v5"/></svg><span>首页</span></button>
        <button class="nav-button" data-page="documents" title="资料库"><svg viewBox="0 0 20 20"><path d="M5 2.5h7l3 3V17.5H5zM12 2.5v3h3M7.5 9h5M7.5 12h5"/></svg><span>资料库</span><span class="nav-count" id="navDocCount">0</span></button>
        <button class="nav-button" data-page="actions" title="待办"><svg viewBox="0 0 20 20"><path d="M4 4h12v12H4zM7 9l2 2 4-4M7 14h6"/></svg><span>待办</span><span class="nav-count" id="navActionCount">0</span></button>
        <button class="nav-button" data-page="saved" title="收藏"><svg viewBox="0 0 20 20"><path d="m10 2 2.4 5 5.5.8-4 4 .9 5.6-4.8-2.7-4.8 2.7.9-5.6-4-4 5.5-.8z"/></svg><span>收藏</span><span class="nav-count" id="navSavedCount">0</span></button>
        <div class="sidebar-spacer"></div>
        <div class="status-card"><div class="status-line"><span class="status-dot"></span> 本次更新</div><span class="status-date" id="releaseTitle"></span><p id="releaseSummary"></p></div>
        <button class="nav-button" data-page="settings" title="设置"><svg viewBox="0 0 20 20"><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M15.7 4.3l-1.4 1.4M5.7 14.3l-1.4 1.4"/><circle cx="10" cy="10" r="3.4"/></svg><span>设置</span></button>
      </aside>
      <main class="main"><div class="content" id="content"></div></main>
    </div>
  </div></div>
  <div class="setup-overlay" id="setupOverlay" hidden>
    <section class="setup-dialog" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
      <span class="setup-mark">v</span><span class="eyebrow">初次使用</span>
      <h2 id="setupTitle">先连接你的 AI，再开始提问</h2>
      <p>Via 不附带共用密钥。请在设置的 AI 连接中选择 DeepSeek 或 OpenAI，填入你自己的 API 密钥并保存。之后在批注中使用 @Via，就能得到回答。</p>
      <div class="setup-actions"><button class="primary" data-setup-configure>去配置密钥</button><button class="outline-btn" data-setup-later>稍后再说</button></div>
      <small>暂时跳过仍可批注、收藏、查看阅读复盘；没有密钥时不能使用 AI 回答。</small>
    </section>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="help-content.js"></script>
  <script src="daily-review.js"></script>
  <script src="auth-ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
